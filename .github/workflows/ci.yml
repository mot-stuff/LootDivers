name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Typecheck, lint, tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Content pipeline checks
        run: npm run content:check

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Microsoft Edge
        run: npx playwright install msedge

      - name: Component tests
        run: npm run test:component

      - name: Build
        run: npm run build

      - name: End-to-end tests (4-browser matrix)
        run: node scripts/run-playwright.mjs --project=chromium --project=edge --project=firefox --project=webkit
