name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PR branches, but NEVER on main: main runs
  # include the droplet deploy, and canceling one mid-deploy kills the SSH
  # session while docker compose is building (observed 2026-09-05 when a
  # docs-only push canceled the first real API deploy). Main runs queue
  # behind each other instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gates:
    name: Typecheck, lint, tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Content pipeline checks
        run: npm run content:check

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Microsoft Edge
        run: npx playwright install msedge

      - name: Component tests
        run: npm run test:component

      - name: Build
        run: npm run build

      # Firefox is excluded here: GitHub-hosted runners have no GPU and
      # headless Linux Firefox exposes no WebGL, so the game correctly
      # reports "unsupported" and every spec fails. A handful of
      # hardware-sensitive specs also skip themselves when CI=true. The
      # authoritative pre-merge gate remains the local 4-browser matrix
      # (chromium, edge, firefox, webkit). See DEC-033.
      - name: End-to-end tests (chromium, edge, webkit)
        run: node scripts/run-playwright.mjs --project=chromium --project=edge --project=webkit

      # The deploy job publishes these exact bytes (DEC-015: the deployed
      # artifact is the tested artifact; no rebuild).
      - name: Upload tested build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  server-gates:
    name: Server typecheck, lint, tests (TASK-707)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    # Real Postgres for the contract suite: the same tests that run against
    # the in-memory store locally also run against PgStore here, so the SQL
    # layer is CI-verified even though dev machines may lack Docker.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test
          POSTGRES_DB: lootdivers_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Server typecheck
        run: npm run typecheck

      - name: Server lint
        run: npm run lint

      - name: Server tests (MemoryStore + Postgres contract suites)
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-test@localhost:5432/lootdivers_test
        run: npm test

      - name: Server Docker image builds
        run: docker build -t lootdivers-api:ci .

  deploy:
    name: Deploy to Cloudflare Pages
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tested build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"

      # Plain wrangler instead of cloudflare/wrangler-action: transparent
      # logs, no third-party action, and the failure tail is surfaced as an
      # annotation so it is diagnosable through the Checks API.
      - name: Publish to Cloudflare Pages (project lootdivers)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repo secret is missing or empty"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID repo secret is missing or empty"
            exit 1
          fi
          # Surface the account's existing Pages projects for diagnosis,
          # and create the lootdivers project if it does not exist yet
          # (idempotent: create fails harmlessly when it already exists).
          projects="$(npx wrangler@4 pages project list 2>&1 | tr '\n' ' | ' || true)"
          echo "::notice::pages projects in account: ${projects}"
          if ! echo "${projects}" | grep -q "lootdivers"; then
            npx wrangler@4 pages project create lootdivers --production-branch=main 2>&1 | tee create.log || {
              echo "::error::pages project create failed: $(tail -c 500 create.log | tr '\n' ' ')"
              exit 1
            }
          fi
          if npx wrangler@4 pages deploy dist --project-name=lootdivers --branch=main 2>&1 | tee wrangler.log; then
            exit 0
          fi
          tail_text="$(tail -c 700 wrangler.log | tr '\n' ' ')"
          echo "::error::wrangler pages deploy failed: ${tail_text}"
          exit 1

      - name: Post-deploy smoke (homepage + /play/ + hashed asset reachable)
        run: |
          set -euo pipefail
          sleep 15
          # "/" is the homepage since TASK-708 (DEC-035); the game lives at
          # /play/. -L on the /play/ checks tolerates Pages' trailing-slash
          # normalization redirects.
          curl -fsSI https://lootdivers.pages.dev/ | head -n 1
          curl -fsS https://lootdivers.pages.dev/ | grep -qi "Loot Divers"
          curl -fsSLI https://lootdivers.pages.dev/play/ | head -n 1
          curl -fsSL https://lootdivers.pages.dev/play/ | grep -qi "Loot Divers"
          asset="$(basename "$(ls dist/assets/*.js | head -n 1)")"
          echo "checking /assets/${asset}"
          curl -fsSI "https://lootdivers.pages.dev/assets/${asset}" | head -n 1

  deploy-api:
    name: Deploy API to droplet (TASK-707)
    needs: [gates, server-gates]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The FIRST deploy builds every docker layer on a small droplet and can
    # exceed 15 minutes; later deploys reuse cached layers and are fast.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # SSH pull-and-restart as the low-privilege deploy user (DEC-032,
      # runbook step 10). The script is piped over stdin so the very first
      # deploy works before /opt/lootdivers/app exists — deploy.sh clones
      # the repo itself when missing. Until the owner creates
      # /opt/lootdivers/.env (runbook Part B step 12) the script exits 0
      # with a SKIP message so main stays green; it self-arms once the
      # file exists. All other deploy problems fail the job loudly.
      - name: Deploy over SSH (pull-and-restart)
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_SSH_USER: ${{ secrets.DROPLET_SSH_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in DROPLET_HOST DROPLET_SSH_USER DROPLET_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} repo secret is missing or empty (runbook Part A step 10d)"
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          printf '%s\n' "${DROPLET_SSH_KEY}" > ~/.ssh/lootdivers_deploy
          chmod 600 ~/.ssh/lootdivers_deploy
          # ServerAlive keepalives: the docker build on the droplet is
          # silent for minutes (BuildKit buffers output) and idle SSH
          # connections from GitHub runners get dropped by intermediate
          # NAT (observed 2026-09-05: "Broken pipe" mid-build, exit 255).
          ssh -i ~/.ssh/lootdivers_deploy \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "${DROPLET_SSH_USER}@${DROPLET_HOST}" "bash -s" < server/deploy.sh
